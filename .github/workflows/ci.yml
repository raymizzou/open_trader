name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trend_v3:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    defaults:
      run:
        working-directory: services/trend_v3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact candidate and install Trend V3
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[dev]'
      - name: Lint Trend V3
        run: .venv/bin/python -m ruff check src tests
      - name: Test Trend V3
        run: .venv/bin/python -m pytest tests

  required:
    name: required
    if: always() && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    needs: [trend_v3]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful Trend V3 checks
        env:
          TREND_V3_RESULT: ${{ needs.trend_v3.result }}
        run: test "$TREND_V3_RESULT" = success
