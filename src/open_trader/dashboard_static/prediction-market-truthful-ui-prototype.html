<!doctype html>
<!-- PROTOTYPE — three truthful-data layouts, switchable with ?variant=A|B|C and ?state=. -->
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open Trader · 预测市场真实数据 UI 原型</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
      body { padding-bottom: 96px; }
      .prototype-note {
        background: #fff8e8;
        border: 1px solid #e7cf9d;
        border-radius: 999px;
        color: #684816;
        font-size: 12px;
        font-weight: 800;
        padding: 7px 10px;
      }
      .prototype-state-switcher {
        background: rgba(255, 254, 250, 0.97);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: var(--shadow);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 0 0 10px;
        padding: 9px;
      }
      .prototype-state-switcher a,
      .prototype-variant-switcher a {
        align-items: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--text);
        cursor: pointer;
        display: inline-flex;
        justify-content: center;
        min-height: 44px;
        padding: 8px 12px;
        text-decoration: none;
      }
      .prototype-state-switcher a[aria-current="page"] {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--on-primary);
        font-weight: 800;
      }
      .prototype-switch-label {
        align-items: center;
        color: var(--muted);
        display: inline-flex;
        font-size: 12px;
        font-weight: 800;
        padding: 0 4px;
      }
      .prototype-switch-divider { border-left: 1px solid var(--line); margin-left: 4px; padding-left: 10px; }
      .prototype-variant-switcher {
        align-items: center;
        background: #171512;
        border: 1px solid #403b34;
        border-radius: 999px;
        bottom: 18px;
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.28);
        color: white;
        display: flex;
        gap: 10px;
        left: 50%;
        padding: 7px;
        position: fixed;
        transform: translateX(-50%);
        z-index: 3000;
      }
      .prototype-variant-switcher a {
        background: #2a2722;
        border-color: #4b453d;
        color: white;
        font-size: 18px;
        min-width: 44px;
        padding: 6px 12px;
      }
      .prototype-variant-label {
        font-weight: 800;
        min-width: 210px;
        text-align: center;
      }
      .prototype-root .pm-readiness,
      .prototype-root .pm-metrics { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .prototype-root .pm-readiness-item:nth-child(4) { border-right: 0; }
      .prototype-root .pm-metric.primary small { color: #d9d5ce; }
      .prototype-root .pm-opportunity { padding: 14px; }
      .prototype-root .pm-button[aria-disabled="true"] { cursor: not-allowed; opacity: 0.46; pointer-events: none; }
      .prototype-root .pm-panel + .pm-panel { margin-top: 10px; }
      .prototype-root .pm-page-head { margin-top: 14px; }
      .prototype-data-note {
        color: var(--muted);
        font-size: 12px;
        margin: -2px 0 10px;
      }
      .prototype-failure-reason {
        background: #fff2f0;
        border: 1px solid #e7aaa4;
        border-radius: 7px;
        color: #7a211a;
        margin-top: 8px;
        padding: 9px 11px;
      }
      .variant-b .pm-opportunity-panel { border-top: 4px solid var(--success); }
      .variant-b .pm-opportunity { border-left: 0; }
      .variant-b .variant-bottom-grid {
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.75fr);
      }
      .variant-b .pm-readiness { margin-bottom: 10px; }
      .variant-c .console-grid {
        align-items: start;
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(300px, 0.28fr) minmax(0, 0.72fr);
      }
      .variant-c .console-rail {
        display: grid;
        gap: 10px;
        position: sticky;
        top: 10px;
      }
      .variant-c .rail-status {
        background: var(--primary);
        border-radius: 8px;
        color: var(--on-primary);
        padding: 16px;
      }
      .variant-c .rail-status .pm-status-line { font-size: 18px; font-weight: 850; }
      .variant-c .rail-status p { color: #d9d5ce; line-height: 1.5; margin: 8px 0 0; }
      .variant-c .pm-readiness { display: grid; grid-template-columns: 1fr; margin: 0; }
      .variant-c .pm-readiness-item {
        border-bottom: 1px solid var(--line);
        border-right: 0;
      }
      .variant-c .pm-readiness-item:last-child { border-bottom: 0; }
      .variant-c .pm-metrics { grid-template-columns: 1fr 1fr; margin: 0; }
      .variant-c .console-main { min-width: 0; }
      .variant-c .pm-panel-heading { margin-bottom: 9px; }
      .prototype-root .pm-modal-layer { display: flex; }
      .prototype-root .pm-modal-layer:empty { display: none; }
      .prototype-root .pm-modal { position: relative; }
      .prototype-modal-note {
        background: #f2eee7;
        border-radius: 6px;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 12px;
        padding: 8px 10px;
      }
      @media (max-width: 1000px) {
        .variant-b .variant-bottom-grid,
        .variant-c .console-grid { grid-template-columns: 1fr; }
        .variant-c .console-rail { position: static; }
      }
      @media (max-width: 720px) {
        body { padding-bottom: 110px; }
        .prototype-root .pm-readiness,
        .prototype-root .pm-metrics { grid-template-columns: 1fr 1fr; }
        .prototype-root .pm-readiness-item:nth-child(even) { border-right: 0; }
        .prototype-root .pm-readiness-item:nth-child(n+3) { border-top: 1px solid var(--line); }
        .prototype-root .pm-readiness-item:last-child { grid-column: auto; }
        .prototype-variant-label { min-width: 150px; }
        .prototype-state-switcher { display: grid; grid-template-columns: 1fr 1fr; }
        .prototype-note { display: block; width: 100%; }
      }
    </style>
  </head>
  <body class="prediction-market-active">
    <div class="dashboard-shell prediction-market-active">
      <header class="pm-topbar" aria-label="一级导航">
        <div class="pm-brand">
          <strong>Open Trader</strong>
          <span>持仓实时看板</span>
          <span class="prototype-note">只读 UI 原型 · 不会下单</span>
        </div>
        <nav class="pm-nav" aria-label="一级导航">
          <button type="button">持仓</button>
          <button type="button" aria-current="page">预测市场</button>
          <button type="button">策略回测</button>
          <button type="button">凯利实验室</button>
        </nav>
      </header>
      <div class="prototype-state-switcher" aria-label="原型状态"></div>
      <main id="prototype-root" class="prototype-root"></main>
    </div>
    <div class="prototype-variant-switcher" aria-label="原型布局切换">
      <a data-variant-step="-1" aria-label="上一个布局">←</a>
      <span class="prototype-variant-label"></span>
      <a data-variant-step="1" aria-label="下一个布局">→</a>
    </div>
    <script>
      const variants = {
        A: "延续当前 Dashboard",
        B: "行动优先",
        C: "运维控制台",
      };
      const states = {
        ready: "正常",
        unavailable: "不可用",
        executing: "执行中",
        success: "成功",
        incident: "事故",
        order: "下单确认",
        reset: "解除熔断",
      };

      function query() {
        const params = new URLSearchParams(location.search);
        return {
          variant: variants[params.get("variant")] ? params.get("variant") : "A",
          state: states[params.get("state")] ? params.get("state") : "ready",
        };
      }

      function navigate(changes) {
        location.href = hrefFor(changes);
      }

      function hrefFor(changes) {
        const current = query();
        const params = new URLSearchParams(location.search);
        Object.entries({...current, ...changes}).forEach(([key, value]) => params.set(key, value));
        return `${location.pathname}?${params}`;
      }

      function healthy(state) {
        return !["unavailable", "incident", "reset"].includes(state);
      }

      function pageHeader(state) {
        const ok = healthy(state);
        return `
          <header class="pm-page-head">
            <div>
              <h1>预测市场套利</h1>
              <p>先看监控范围和实盘状态，再决定是否参与当前机会。</p>
            </div>
            <div class="pm-updated">
              <span class="pm-status-line"><i class="pm-status-dot ${ok ? "" : "danger"}"></i>Watcher ${ok ? "正常" : "不可用"}</span><br>
              最后心跳：${ok ? "2026-07-28 16:18:42 CST" : "-"}
              ${ok ? "" : '<div class="prototype-failure-reason">原因：盘口心跳已过期</div>'}
            </div>
          </header>`;
      }

      function readiness(state) {
        const ok = healthy(state);
        return `
          <section class="pm-readiness" aria-label="实盘就绪状态">
            <article class="pm-readiness-item"><span>交易钱包</span><strong>0x1AF9…0562</strong><small>独立低余额钱包 · Keychain</small></article>
            <article class="pm-readiness-item"><span>可用余额</span><strong>${ok ? "$60.40 pUSD" : "-"}</strong><small>不自动充值</small></article>
            <article class="pm-readiness-item"><span>地区与连接</span><strong class="${ok ? "pm-tone-ok" : "pm-tone-danger"}">${ok ? "允许交易" : "不可用"}</strong><small>${ok ? "官方 geoblock · 本机访问" : "盘口心跳已过期"}</small></article>
            <article class="pm-readiness-item"><span>实盘状态</span><strong class="${ok ? "pm-tone-ok" : "pm-tone-danger"}">${ok ? "可以交易" : "不可用"}</strong><small>${ok ? "单笔上限 $20 · 应急上限 $2" : "参与按钮已禁用"}</small></article>
          </section>`;
      }

      function metrics(state) {
        const ok = healthy(state);
        const value = (normal) => ok ? normal : "-";
        return `
          <section class="pm-metrics" aria-label="监控摘要">
            <article class="pm-metric primary"><span>当前可参与</span><strong>${value("1")}</strong><small>${ok ? "后台检查全部通过" : "Watcher 不可用"}</small></article>
            <article class="pm-metric"><span>监控事件</span><strong>${value("19")}</strong><small>按 24h 成交量动态筛选</small></article>
            <article class="pm-metric"><span>市场 / Token</span><strong>${value("273 / 546")}</strong><small>不可参与市场仍持续监控</small></article>
            <article class="pm-metric"><span>过去 24 小时信号</span><strong>${value("3")}</strong><small>曾达到可参与条件</small></article>
          </section>`;
      }

      function alertBox(state) {
        if (state === "executing") return `
          <section class="pm-alert info" role="status">
            <div class="pm-alert-body">
              <strong>正在执行：Fed 决议二元市场</strong>
              <p>本笔完成前，其他机会暂时不可参与。</p>
              <div class="pm-progress">
                <div class="pm-progress-step done"><span>1 · 最终检查</span><strong>已通过</strong></div>
                <div class="pm-progress-step done"><span>2 · 双腿提交</span><strong>FOK 已签名</strong></div>
                <div class="pm-progress-step current"><span>3 · 成交核对</span><strong>读取结果</strong></div>
                <div class="pm-progress-step"><span>4 · 自动合并</span><strong>等待完整代币组</strong></div>
              </div>
            </div><span class="pm-pill watch">执行中</span>
          </section>`;
        if (state === "success") return `
          <section class="pm-alert success" role="status">
            <div class="pm-alert-body"><strong>两腿已成交并自动合并</strong><p>数量 20 组 · 实际成本 $18.80 · 合并收回 $20.00 · 已实现利润 <b>+$1.20</b></p></div>
            <span class="pm-pill action">完成于 16:20:12</span>
          </section>`;
        if (state === "incident" || state === "reset") return `
          <section class="pm-alert danger" role="alert">
            <div class="pm-alert-body"><strong>交易已熔断</strong><p>原因：第二腿未成交，自动处置结果尚未确认 · 发生时间：2026-07-28 16:20:12 CST</p></div>
            <a class="pm-button danger" href="${hrefFor({state: "reset"})}">查看事故并处理</a>
          </section>`;
        if (state === "unavailable") return `
          <section class="pm-alert danger" role="alert"><div class="pm-alert-body"><strong>预测市场当前不可用</strong><p>盘口心跳已过期；系统不会开放参与按钮。</p></div><span class="pm-pill watch">失败关闭</span></section>`;
        return "";
      }

      function policy() {
        return `<aside class="pm-policy"><strong>V1 只对 Polymarket 普通二元、免手续费市场开放实盘</strong><p>收费市场和 Negative Risk 市场仍监控，但不会出现“参与”按钮。</p></aside>`;
      }

      function opportunity(state) {
        const unavailable = state === "unavailable";
        const busy = state === "executing";
        const blocked = ["incident", "reset"].includes(state);
        const disabled = unavailable || busy || blocked;
        return `
          <section class="pm-panel pm-opportunity-panel">
            <header class="pm-panel-heading"><div><h2>当前机会</h2><p>后台检查通过后，才允许在 Open Trader 内确认下单。</p></div><span class="pm-pill venue">Polymarket</span></header>
            <article class="pm-opportunity ${disabled ? "disabled" : ""}">
              <div class="pm-opportunity-title"><div><h3>Fed 决议二元市场</h3><p>${unavailable ? "普通二元 · 费用状态 -" : "普通二元 · 免手续费 · 16:18:41 CST"}</p></div><span class="pm-pill ${disabled ? "watch" : "action"}">${unavailable ? "数据不完整" : disabled ? "暂不可参与" : "可参与"}</span></div>
              <dl class="pm-opportunity-metrics">
                <div><dt>YES 最高买价</dt><dd>${unavailable ? "-" : "$0.472"}</dd></div>
                <div><dt>NO 最高买价</dt><dd>${unavailable ? "-" : "$0.468"}</dd></div>
                <div><dt>自动数量</dt><dd>${unavailable ? "-" : "20 组"}</dd></div>
                <div><dt>最大成本</dt><dd>${unavailable ? "-" : "$18.80"}</dd></div>
                <div><dt>最低净利润</dt><dd class="pm-positive">${unavailable ? "-" : "+$1.20"}</dd></div>
              </dl>
              <div class="pm-opportunity-action"><p>${unavailable ? "缺少权威行情字段，不能参与。" : "点击后读取后台最新完整 preview。"}</p><a class="pm-button primary pm-participate" ${disabled ? 'aria-disabled="true"' : `href="${hrefFor({state: "order"})}"`}>${busy ? "另一笔正在执行" : blocked ? "熔断中" : unavailable ? "数据不完整" : "参与 · 预计 +$1.20"}</a></div>
            </article>
          </section>`;
      }

      function events() {
        return `
          <section class="pm-panel">
            <header class="pm-panel-heading"><div><h2>当前监控范围</h2><p>可参与优先；同组按利润，再按 24h 成交量。</p></div><span class="pm-pill">显示 3 / 19</span></header>
            <div class="pm-event-list">
              <details class="pm-event" open><summary><div><div class="pm-event-title">Fed 决议二元市场</div><div class="pm-event-meta">2 · 预计净利润 $1.20 · 排名 #1</div></div><div class="pm-volume"><span>24h 成交量</span>$11.4M</div><div class="pm-event-state">可参与</div></summary><div class="pm-market-list"><div class="pm-market-line"><span>YES + NO 完整代币组</span><span>后台检查通过</span></div></div></details>
              <details class="pm-event"><summary><div><div class="pm-event-title">Next Prime Minister of Ethiopia?</div><div class="pm-event-meta">8 · 毛利润上限 $0.00 · 排名 #2</div></div><div class="pm-volume"><span>24h 成交量</span>$1.6M</div><div class="pm-event-state watch">仅监控</div></summary></details>
              <details class="pm-event"><summary><div><div class="pm-event-title">What price will Bitcoin hit in July?</div><div class="pm-event-meta">19 · 毛利润上限 $0.00 · 排名 #3</div></div><div class="pm-volume"><span>24h 成交量</span>$1.3M</div><div class="pm-event-state watch">仅监控</div></summary></details>
            </div>
          </section>`;
      }

      function history(state) {
        let content = `<div class="pm-empty compact"><strong>还没有真实交易</strong><p>第一笔真实机会完成后，这里记录两腿订单、合并交易和已实现利润。</p></div>`;
        if (state === "success") content = `<table class="pm-table"><thead><tr><th>完成时间</th><th>市场</th><th>数量</th><th>实际成本</th><th>合并收回</th><th>已实现</th></tr></thead><tbody><tr><td>16:20:12 CST</td><td>Fed 决议二元市场</td><td>20 组</td><td>$18.80</td><td>$20.00</td><td class="pm-positive"><strong>+$1.20</strong></td></tr></tbody></table>`;
        if (state === "incident" || state === "reset") content = `<table class="pm-table"><thead><tr><th>发生时间</th><th>市场</th><th>原因</th><th>自动处置</th><th>损失</th><th>状态</th></tr></thead><tbody><tr><td>16:20:12 CST</td><td>Fed 决议二元市场</td><td>第二腿未成交</td><td>结果未确认</td><td>-</td><td>待人工处理</td></tr></tbody></table>`;
        return `
          <section class="pm-panel">
            <header class="pm-panel-heading"><div><h2>历史记录</h2><p>信号、真实交易与事故分开保存。</p></div><div class="pm-history-tabs"><button class="pm-history-tab" type="button">信号历史</button><button class="pm-history-tab" type="button" aria-pressed="${state === "success"}">交易与合并</button><button class="pm-history-tab" type="button" aria-pressed="${state === "incident" || state === "reset"}">事故</button></div></header>
            ${content}
          </section>`;
      }

      function orderModal() {
        return `
          <div class="pm-modal-layer">
            <section class="pm-modal" role="dialog" aria-modal="true" aria-labelledby="order-title">
              <div class="prototype-modal-note">原型：以下字段全部来自同一个后台 preview。</div>
              <header class="pm-modal-header"><h2 id="order-title">确认真实下单</h2><p>由 Open Trader 使用独立钱包直接签名并执行。</p></header>
              <div class="pm-order-market"><span>Polymarket · 普通二元 · 免手续费</span><strong>Fed 决议二元市场</strong></div>
              <div class="pm-order-legs"><article class="pm-order-leg"><span>第一腿 · BUY YES · FOK</span><strong>20 份 @ 最高 $0.472</strong><small>最大成本 $9.44 · 全成或全撤</small></article><article class="pm-order-leg"><span>第二腿 · BUY NO · FOK</span><strong>20 份 @ 最高 $0.468</strong><small>最大成本 $9.36 · 全成或全撤</small></article></div>
              <div class="pm-order-summary"><div><span>正常最大成本</span><strong>$18.80</strong></div><div><span>合并收回</span><strong>$20.00</strong></div><div><span>最低净利润</span><strong class="pm-positive">+$1.20</strong></div></div>
              <div class="pm-risk-note"><strong>两笔订单不是原子交易</strong><p>可能只成交一腿；应急处置上限 $2。</p></div>
              <div class="pm-check-list"><div class="pm-check"><span>独立钱包</span><strong>0x1AF9…0562 · 上限 $65</strong></div><div class="pm-check"><span>确认时处理</span><strong>重新检查价格、费用、余额和地区</strong></div><div class="pm-check"><span>失败规则</span><strong>净利润低于 $1 就拒绝</strong></div></div>
              <footer class="pm-modal-actions"><a class="pm-button" href="${hrefFor({state: "ready"})}">取消</a><a class="pm-button primary" href="${hrefFor({state: "ready"})}">确认下单 · 最多 $20</a></footer>
            </section>
          </div>`;
      }

      function resetModal() {
        return `
          <div class="pm-modal-layer">
            <section class="pm-modal" role="dialog" aria-modal="true" aria-labelledby="reset-title">
              <div class="prototype-modal-note">原型：弹窗不声称已经完成实时检查。</div>
              <header class="pm-modal-header"><h2 id="reset-title">确认重新检查并解除熔断</h2><p>事故记录会永久保留；后台检查通过后才恢复交易。</p></header>
              <div class="pm-check-list">
                <div class="pm-check"><span>事故时间</span><strong>2026-07-28 16:20:12 CST</strong></div>
                <div class="pm-check"><span>市场</span><strong>Fed 决议二元市场</strong></div>
                <div class="pm-check"><span>原因</span><strong>第二腿未成交，处置结果未确认</strong></div>
                <div class="pm-check"><span>实际损失</span><strong>-</strong></div>
              </div>
              <div class="pm-risk-note"><strong>点击后执行实时检查</strong><p>未完成订单、方向敞口、待合并状态、账户时效、交易与通知链路。</p></div>
              <footer class="pm-modal-actions"><a class="pm-button" href="${hrefFor({state: "incident"})}">保持熔断</a><a class="pm-button danger" href="${hrefFor({state: "incident"})}">重新检查并解除</a></footer>
            </section>
          </div>`;
      }

      function modal(state) {
        if (state === "order") return orderModal();
        if (state === "reset") return resetModal();
        return "";
      }

      function variantA(state) {
        return `<div class="variant-a">${pageHeader(state)}${readiness(state)}${alertBox(state)}${metrics(state)}${policy()}<div class="pm-layout">${events()}<div class="pm-stack">${opportunity(state)}${history(state)}</div></div>${modal(state)}</div>`;
      }

      function variantB(state) {
        return `<div class="variant-b">${pageHeader(state)}${alertBox(state)}${readiness(state)}${opportunity(state)}${metrics(state)}${policy()}<div class="variant-bottom-grid">${events()}${history(state)}</div>${modal(state)}</div>`;
      }

      function variantC(state) {
        const ok = healthy(state);
        return `<div class="variant-c">${pageHeader(state)}<div class="console-grid"><aside class="console-rail"><section class="rail-status"><span class="pm-status-line"><i class="pm-status-dot ${ok ? "" : "danger"}"></i>${ok ? "可以交易" : "不可用"}</span><p>${ok ? "后台状态明确正常；单笔上限 $20，应急上限 $2。" : "盘口心跳已过期；参与按钮已禁用。"}</p></section>${readiness(state)}${metrics(state)}</aside><div class="console-main">${alertBox(state)}${opportunity(state)}${policy()}${events()}${history(state)}</div></div>${modal(state)}</div>`;
      }

      function render() {
        const current = query();
        const renderVariant = {A: variantA, B: variantB, C: variantC}[current.variant];
        document.querySelector("#prototype-root").innerHTML = `<p class="prototype-data-note">原型样例数据用于确认布局，不代表真实账户或交易。</p>${renderVariant(current.state)}`;
        const layoutLinks = Object.entries(variants).map(([key, label]) => `<a href="${hrefFor({variant: key})}" aria-current="${current.variant === key ? "page" : "false"}">${key} · ${label}</a>`).join("");
        const stateLinks = Object.entries(states).map(([key, label]) => `<a href="${hrefFor({state: key})}" aria-current="${current.state === key ? "page" : "false"}">${label}</a>`).join("");
        document.querySelector(".prototype-state-switcher").innerHTML = `<span class="prototype-switch-label">布局</span>${layoutLinks}<span class="prototype-switch-label prototype-switch-divider">状态</span>${stateLinks}`;
        document.querySelector(".prototype-variant-label").textContent = `${current.variant} — ${variants[current.variant]}`;
        const keys = Object.keys(variants);
        const index = keys.indexOf(current.variant);
        document.querySelector('[data-variant-step="-1"]').href = hrefFor({variant: keys[(index - 1 + keys.length) % keys.length]});
        document.querySelector('[data-variant-step="1"]').href = hrefFor({variant: keys[(index + 1) % keys.length]});
      }

      document.addEventListener("keydown", (event) => {
        if (!["ArrowLeft", "ArrowRight"].includes(event.key) || event.target.matches("input, textarea, [contenteditable]")) return;
        const keys = Object.keys(variants);
        const index = keys.indexOf(query().variant);
        navigate({variant: keys[(index + (event.key === "ArrowRight" ? 1 : -1) + keys.length) % keys.length]});
      });
      render();
    </script>
  </body>
</html>
