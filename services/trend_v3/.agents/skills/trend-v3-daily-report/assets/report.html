<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>趋势动物观察报告｜{{report-date}}</title>
  <style>
    :root {
      color-scheme: light;
      --ground: #f5f2eb;
      --paper: #fffcf6;
      --ink: #242720;
      --muted: #55594f;
      --rule: #d4cec1;
      --soft-rule: #e5dfd3;
      --short: #8a4036;
      --short-wash: #f8eee9;
      --long: #285e4e;
      --long-wash: #edf3ec;
      --serif: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", SimSun, serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-padding-block-start: 1rem; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font: 1rem/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .sheet {
      inline-size: min(calc(100% - 2rem), 70rem);
      margin-inline: auto;
      padding-block: clamp(1.35rem, 4vw, 3rem) 3rem;
    }
    h1, h2, h3, p, dl, dd { margin: 0; }
    a { color: inherit; }
    a:focus-visible, summary:focus-visible, main:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    .number, .ticker {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .skip-link {
      position: absolute;
      inset-block-start: .5rem;
      inset-inline-start: 1rem;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      min-block-size: 44px;
      padding-inline: .75rem;
      background: var(--paper);
      transform: translateY(-140%);
    }
    .skip-link:focus { transform: none; }
    .masthead {
      border-block-start: 4px solid var(--ink);
      padding-block-start: .85rem;
    }
    .edition {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      column-gap: 1.5rem;
      row-gap: .35rem;
      font-size: .86rem;
      font-weight: 650;
    }
    .edition time { color: var(--muted); }
    .masthead h1 {
      margin-block: .65rem .35rem;
      font: 750 clamp(2rem, 6vw, 4.75rem)/1.13 var(--serif);
      letter-spacing: .025em;
    }
    .masthead p {
      margin-block-end: 1.1rem;
      color: var(--muted);
      font-size: .9rem;
    }
    .contents {
      display: flex;
      flex-wrap: wrap;
      column-gap: clamp(.45rem, 2vw, 1.75rem);
      padding-block: .2rem;
      border-block: 1px solid var(--rule);
    }
    .contents a {
      display: inline-flex;
      min-inline-size: 44px;
      min-block-size: 44px;
      align-items: center;
      padding-inline: .4rem;
      font-size: .875rem;
      font-weight: 650;
      text-decoration: none;
    }
    .contents a:hover { text-decoration: underline; text-underline-offset: .24em; }
    main { padding-block-start: 1.55rem; }
    .directions { display: grid; gap: 1.6rem; }
    .short { --accent: var(--short); --wash: var(--short-wash); }
    .long { --accent: var(--long); --wash: var(--long-wash); }
    .section-title {
      font: 750 clamp(1.36rem, 3vw, 1.8rem)/1.3 var(--serif);
      letter-spacing: .035em;
    }
    .direction .section-title {
      padding-block: .65rem .7rem;
      border-block-start: 2px solid var(--accent);
      color: var(--accent);
    }
    .classes { display: grid; gap: .55rem; }
    .class-row {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: .3rem;
    }
    .class-row summary {
      display: grid;
      grid-template-columns: 1.1rem minmax(0, 1fr) max-content max-content;
      align-items: center;
      gap: clamp(.45rem, 1.4vw, 1.05rem);
      min-block-size: 64px;
      padding: .55rem clamp(.7rem, 2vw, 1rem);
      border-radius: .25rem;
      list-style: none;
      cursor: pointer;
    }
    .class-row summary::-webkit-details-marker { display: none; }
    .class-row[open] summary, .class-row summary:hover { background: var(--wash); }
    .class-row[open] summary { border-end-start-radius: 0; border-end-end-radius: 0; }
    .chevron {
      justify-self: center;
      inline-size: .55rem;
      block-size: .55rem;
      margin-inline-end: .23rem;
      border: solid var(--accent);
      border-width: 0 2px 2px 0;
      transform: rotate(-45deg);
    }
    [open] > summary .chevron {
      margin-inline-end: 0;
      margin-block-start: -.23rem;
      transform: rotate(45deg);
    }
    .class-name { font-size: clamp(1.08rem, 2.5vw, 1.28rem); font-weight: 720; }
    .stat {
      display: grid;
      min-inline-size: 2.55rem;
      gap: .1rem;
      justify-items: end;
      line-height: 1.15;
    }
    .stat-label { color: var(--muted); font-size: .75rem; }
    .stat .number { color: var(--accent); font-size: 1.22rem; font-weight: 650; }
    .ledger { padding: .25rem clamp(.75rem, 2.2vw, 1.15rem) .65rem; }
    .asset-group { padding-block-start: .55rem; }
    .asset-group + .asset-group { margin-block-start: .45rem; }
    .asset-group h3 {
      padding-block-end: .26rem;
      border-block-end: 1px solid var(--rule);
      color: var(--muted);
      font-size: .835rem;
      font-weight: 700;
    }
    .asset-list { margin: 0; padding: 0; list-style: none; }
    .asset {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: .65rem;
      row-gap: .13rem;
      padding-block: .49rem;
    }
    .asset + .asset { border-block-start: 1px solid var(--soft-rule); }
    .asset-name {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .04rem .6rem;
      min-inline-size: 0;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    .ticker { font-weight: 720; }
    .asset-status {
      margin-block-start: .05rem;
      padding: .12rem .4rem;
      border: 1px solid var(--soft-rule);
      border-radius: .2rem;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 650;
      text-align: center;
    }
    .asset-status.signal {
      background: var(--wash);
      border-color: transparent;
      color: var(--accent);
    }
    .asset-note, .empty-direct {
      color: var(--muted);
      font-size: .85rem;
    }
    .asset-note { grid-column: 1 / -1; }
    .empty-direct { padding-block: .5rem; }
    .record { margin-block-start: clamp(1.6rem, 4vw, 2.3rem); }
    .record .section-title {
      padding-block: .65rem;
      border-block-start: 2px solid var(--ink);
    }
    .reserved {
      min-block-size: 4.5rem;
      border-block: 1px solid var(--soft-rule);
      background: var(--paper);
    }
    .positions-note {
      margin-block: 0 .65rem;
      color: var(--muted);
      font-size: .86rem;
    }
    .positions { border-block: 1px solid var(--rule); background: var(--paper); }
    .position-head { display: none; }
    .position {
      display: grid;
      gap: .5rem;
      padding: .7rem .8rem;
    }
    .position + .position { border-block-start: 1px solid var(--rule); }
    .position h3 { font-size: .94rem; }
    .position h3 .ticker { margin-inline-end: .38em; }
    .position dl {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 6.75rem), 1fr));
      gap: .52rem .7rem;
    }
    .position dt { color: var(--muted); font-size: .785rem; }
    .position dd { font-size: .95rem; }
    .position .direction-label, .pnl { font-weight: 720; }
    .position .short-label, .pnl.loss { color: var(--short); }
    .position .long-label, .pnl.gain { color: var(--long); }
    .kelly-values {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-block: 1px solid var(--rule);
      background: var(--paper);
    }
    .kelly-values > div { padding: .65rem .85rem .85rem; }
    .kelly-values > div + div { border-inline-start: 1px solid var(--rule); }
    .kelly-values dt { font-weight: 650; font-size: .88rem; }
    .kelly-values dd { min-block-size: 1.7rem; }


    .discipline {
      margin-block-end: 1.5rem;
      border: 1px solid var(--rule);
      border-radius: .3rem;
      background: var(--paper);
    }
    .discipline summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      min-block-size: 56px;
      padding: .7rem clamp(.75rem, 2.4vw, 1.15rem);
      border-radius: .25rem;
      font: 750 clamp(1.15rem, 2.8vw, 1.42rem)/1.35 var(--serif);
      letter-spacing: .025em;
      cursor: pointer;
      list-style: none;
    }
    .discipline summary::-webkit-details-marker { display: none; }
    .discipline summary:hover,
    .discipline details[open] > summary { background: var(--ground); }
    .discipline details[open] > summary {
      border-block-end: 1px solid var(--rule);
      border-end-start-radius: 0;
      border-end-end-radius: 0;
    }
    .discipline .disclosure-mark {
      flex: 0 0 .58rem;
      block-size: .58rem;
      margin-inline-end: .25rem;
      border: solid var(--ink);
      border-width: 0 2px 2px 0;
      transform: rotate(-45deg);
    }
    .discipline details[open] .disclosure-mark {
      margin-block-start: -.24rem;
      transform: rotate(45deg);
    }
    .discipline .discipline-document {
      max-inline-size: 54rem;
      margin-inline: auto;
      padding: clamp(.75rem, 3vw, 1.5rem);
      overflow-wrap: anywhere;
    }
    .discipline .discipline-attribution {
      margin-block-end: .9rem;
      color: var(--muted);
      font-size: .86rem;
    }
    .discipline h2 {
      font: 750 clamp(1.3rem, 3vw, 1.85rem)/1.35 var(--serif);
    }
    .discipline h3 {
      margin-block: 1.65rem .5rem;
      padding-block-start: .55rem;
      border-block-start: 1px solid var(--rule);
      font: 750 clamp(1.1rem, 2.6vw, 1.29rem)/1.4 var(--serif);
    }
    .discipline blockquote { margin: 0; }
    .discipline .discipline-source-text > blockquote {
      padding: .65rem .8rem;
      border-inline-start: 2px solid var(--muted);
      background: var(--ground);
    }
    .discipline .discipline-source-text > :is(ol, ul, p, blockquote, table) {
      margin-block: .6rem .85rem;
    }
    .discipline .discipline-source-text > :last-child { margin-block-end: 0; }
    .discipline blockquote > p + p { margin-block-start: .45rem; }
    .discipline :is(ol, ul) { padding-inline-start: 1.4rem; }
    .discipline li + li { margin-block-start: .26rem; }
    .discipline table {
      inline-size: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      font-size: .875rem;
      font-variant-numeric: tabular-nums;
    }
    .discipline :is(th, td) {
      padding: .42rem clamp(.38rem, 1.7vw, .75rem);
      border-block-end: 1px solid var(--rule);
      text-align: start;
      vertical-align: top;
    }
    .discipline thead { background: var(--ground); }

    @media (min-width: 46rem) {
      .sheet { inline-size: min(calc(100% - 4rem), 70rem); }
      .directions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .edition { flex-direction: row-reverse; }
    }
    @media (min-width: 52rem) {
      .positions {
        --position-columns: minmax(10rem, 1.55fr) repeat(2, minmax(3.4rem, .65fr))
                            repeat(2, minmax(4.6rem, .85fr)) minmax(6.7rem, 1fr);
        --position-gap: .85rem;
      }
      .position-head, .position {
        display: grid;
        grid-template-columns: var(--position-columns);
        align-items: baseline;
        gap: var(--position-gap);
        padding-inline: 1rem;
      }
      .position-head {
        padding-block: .55rem;
        border-block-end: 1px solid var(--rule);
        color: var(--muted);
        font-size: .8rem;
        font-weight: 650;
      }
      .position-head span:nth-child(n + 3), .position dl > div:nth-child(n + 2) {
        text-align: end;
      }
      .position dl {
        grid-column: 2 / -1;
        grid-template-columns: repeat(2, minmax(3.4rem, .65fr))
                               repeat(2, minmax(4.6rem, .85fr)) minmax(6.7rem, 1fr);
        gap: var(--position-gap);
      }
      .position dt {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    }
    .position .position-note {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: .85rem;
      overflow-wrap: anywhere;
    }
    .position :is(h3, dd), .asset-note, .report-evidence { overflow-wrap: anywhere; }
    .report-evidence {
      margin-block-start: 1.6rem;
      padding-block-start: .65rem;
      border-block-start: 1px solid var(--rule);
      color: var(--muted);
      font-size: .8rem;
    }
    .report-evidence summary { cursor: pointer; font-weight: 650; }
    .report-evidence p { margin-block-start: .4rem; }
  </style>
</head>
<body>
  <a class="skip-link" href="#report">跳到报告正文</a>
  <div class="sheet">
    <header class="masthead">
      <div class="edition">
        <span>Trend V3 日报</span>
        <time datetime="{{report-date}}"><!-- slot:edition-date --></time>
      </div>
      <h1>趋势动物观察报告</h1>
      <p><!-- slot:summary --></p>
      <nav class="contents" aria-label="报告目录">
        <a href="#short">做空</a>
        <a href="#long">做多</a>
        <a href="#live">实盘</a>
        <a href="#simulation">模拟盘</a>
        <a href="#kelly">凯利胜率</a>
      </nav>
    </header>

    <main id="report" tabindex="-1">
      <section id="discipline" class="discipline" aria-labelledby="discipline-title">
        <details>
          <summary id="discipline-title">
            趋势交易纪律 V3
            <span class="disclosure-mark" aria-hidden="true"></span>
          </summary>
          <div class="discipline-document">
            <p class="discipline-attribution">引自 <code>纪律.md</code>（提交 <code><!-- slot:revision --></code>）。</p>
            <blockquote class="discipline-source-text" aria-labelledby="discipline-source-heading">
              <!-- slot:discipline -->
            </blockquote>
          </div>
        </details>
      </section>

      <div class="directions">
        <section id="short" class="direction short" aria-labelledby="short-title">
          <h2 id="short-title" class="section-title">可做空的大类</h2>
          <div class="classes"><!-- slot:short-classes --></div>
        </section>
        <section id="long" class="direction long" aria-labelledby="long-title">
          <h2 id="long-title" class="section-title">可做多的大类</h2>
          <div class="classes"><!-- slot:long-classes --></div>
        </section>
      </div>

      <section id="live" class="record" aria-labelledby="live-title">
        <h2 id="live-title" class="section-title">当前实盘持仓</h2>
        <div class="reserved"></div>
      </section>

      <section id="simulation" class="record" aria-labelledby="simulation-title">
        <h2 id="simulation-title" class="section-title">模拟盘持仓情况</h2>
        <!-- slot:simulation -->
      </section>

      <section id="kelly" class="record" aria-labelledby="kelly-title">
        <h2 id="kelly-title" class="section-title">当前凯利胜率</h2>
        <dl class="kelly-values">
          <div><dt>实盘</dt><dd></dd></div>
          <div><dt>模拟盘</dt><dd></dd></div>
        </dl>
      </section>
    </main>

    <footer class="report-evidence">
      <details>
        <summary>费用与证据</summary>
        <!-- slot:evidence -->
      </details>
    </footer>
  </div>

  <!-- Reuse these inert patterns when rendering; remove all template elements from the report. -->
  <template id="class-pattern">
    <details class="class-row">
      <summary>
        <span class="chevron" aria-hidden="true"></span>
        <span class="class-name"><!-- slot:class-name --></span>
        <span class="stat"><span class="stat-label">组内排名</span><span class="number"><!-- slot:class-rank --></span></span>
        <span class="stat"><span class="stat-label">强度</span><span class="number"><!-- slot:class-strength --></span></span>
      </summary>
      <div class="ledger">
        <p class="asset-note"><!-- slot:class-coverage --></p>
        <div class="asset-group">
          <h3>直接交易标的</h3>
          <!-- slot:direct-assets -->
        </div>
        <div class="asset-group">
          <h3>关联标的</h3>
          <!-- slot:related-assets -->
        </div>
      </div>
    </details>
  </template>

  <template id="asset-pattern">
    <li class="asset">
      <span class="asset-name"><span class="ticker"><!-- slot:ticker --></span> <!-- slot:asset-name --></span>
      <span class="asset-status"><!-- slot:asset-status --></span>
      <span class="asset-note"><!-- slot:asset-evidence --></span>
    </li>
  </template>

  <!-- For unavailable or verified-empty SIM, emit a status paragraph instead of the grid. -->
  <template id="positions-pattern">
    <p class="positions-note"><!-- slot:positions-basis --></p>
    <div class="positions">
      <div class="position-head" aria-hidden="true">
        <span>标的</span><span>方向</span><span>数量</span><span>开仓价</span><span>最新价</span><span>浮动盈亏</span>
      </div>
      <!-- slot:position-rows -->
    </div>
  </template>

  <template id="position-pattern">
    <article class="position">
      <h3><span class="ticker"><!-- slot:ticker --></span> <!-- slot:asset-name --></h3>
      <dl>
        <div><dt>方向</dt><dd class="direction-label"><!-- slot:position-direction --></dd></div>
        <div><dt>数量</dt><dd class="number"><!-- slot:position-quantity --></dd></div>
        <div><dt>开仓价</dt><dd class="number"><!-- slot:position-entry --></dd></div>
        <div><dt>最新价</dt><dd class="number"><!-- slot:position-price --></dd></div>
        <div><dt>浮动盈亏</dt><dd class="number pnl"><!-- slot:position-pnl --></dd></div>
      </dl>
      <p class="position-note"><!-- slot:position-evidence --></p>
    </article>
  </template>
</body>
</html>
