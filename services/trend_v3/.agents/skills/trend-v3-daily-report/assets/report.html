<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>趋势日报</title>
  <style>
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: #182722;
      font: 17px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { max-width: 660px; margin: auto; padding: 24px 20px 40px; }
    h1, h2, h3, p, dl, dd { margin: 0; }
    header { margin-bottom: 26px; }
    header p { font-size: 14px; color: #55635c; margin-top: 2px; }
    h1 { font-size: 29px; letter-spacing: -.025em; line-height: 1.3; }
    h2 {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      color: var(--accent);
      line-height: 1.45;
      margin-bottom: 4px;
      overflow-wrap: anywhere;
    }
    h2::before {
      content: "";
      flex: 0 0 4px;
      height: 19px;
      border-radius: 2px;
      background: var(--accent);
    }
    section { margin-top: 26px; }
    section + section { border-top: 1px solid #aab8b0; padding-top: 19px; margin-top: 6px; }
    .short { --accent: #89452e; }
    .long { --accent: #22634d; }
    article { padding: 15px 0 16px; }
    article + article { border-top: 1px solid #d8dfda; }
    h3 { font-size: 19px; line-height: 1.45; overflow-wrap: anywhere; }
    h3 span { font-weight: 450; }
    dl {
      display: grid;
      grid-template-columns: minmax(48px, .75fr) minmax(110px, 1.75fr) minmax(55px, .8fr);
      gap: 10px;
      margin-top: 12px;
    }
    dt { font-size: 13px; color: #56645d; margin-bottom: 1px; }
    dd { font-size: 19px; font-weight: 650; line-height: 1.45; overflow-wrap: anywhere; }
    .event { color: var(--accent); }
    .score { font-variant-numeric: tabular-nums; }
    .score small { font-size: 13px; font-weight: 450; color: #56645d; }
    .reason { margin-top: 11px; font-size: 16px; line-height: 1.55; color: #35463d; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>趋势日报</h1>
      <!-- slot:synthetic-label -->
    </header>
    <!-- slot:groups -->
  </main>
  <template id="group-pattern">
    <section class="<!-- slot:direction-class -->">
      <h2><!-- slot:direction --> · <!-- slot:class-name --></h2>
      <!-- slot:cards -->
    </section>
  </template>
  <template id="candidate-pattern">
    <article>
      <h3><!-- slot:ticker --> <span>· <!-- slot:asset-name --></span></h3>
      <dl>
        <div><dt>当前趋势</dt><dd><!-- slot:temperature --></dd></div>
        <div><dt>特殊信号</dt><dd class="event"><!-- slot:events --></dd></div>
        <div><dt>强度</dt><dd class="score"><!-- slot:strength --><!-- optional:strength-unit --> <small>/ 100</small><!-- /optional:strength-unit --></dd></div>
      </dl>
      <p class="reason"><!-- slot:reason --></p>
    </article>
  </template>
</body>
</html>
