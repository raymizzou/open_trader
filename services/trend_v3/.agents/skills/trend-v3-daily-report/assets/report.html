<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>趋势动物观察报告</title>
  <style>
    :root {
      color-scheme: light;
      --ground: #f5f2eb;
      --paper: #fffcf6;
      --ink: #242720;
      --muted: #55594f;
      --rule: #d4cec1;
      --soft-rule: #e5dfd3;
      --short: #8a4036;
      --short-wash: #f8eee9;
      --long: #285e4e;
      --long-wash: #edf3ec;
      --serif: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", SimSun, serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-padding-block-start: 1rem; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font: 1rem/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .sheet {
      inline-size: min(calc(100% - 2rem), 70rem);
      margin-inline: auto;
      padding-block: clamp(1.35rem, 4vw, 3rem) 3rem;
    }
    h1, h2, h3, p, dl, dd { margin: 0; }
    a { color: inherit; }
    a:focus-visible, summary:focus-visible, main:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    .number, .ticker {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums lining-nums;
    }
    .skip-link {
      position: absolute;
      inset-block-start: .5rem;
      inset-inline-start: 1rem;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      min-block-size: 44px;
      padding-inline: .75rem;
      background: var(--paper);
      transform: translateY(-140%);
    }
    .skip-link:focus { transform: none; }
    .masthead {
      border-block-start: 4px solid var(--ink);
      padding-block-start: .85rem;
    }
    .edition {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      column-gap: 1.5rem;
      row-gap: .35rem;
      font-size: .86rem;
      font-weight: 650;
    }
    .edition time { color: var(--muted); }
    .masthead h1 {
      margin-block: .65rem .35rem;
      font: 750 clamp(2rem, 6vw, 4.75rem)/1.13 var(--serif);
      letter-spacing: .025em;
    }
    .masthead p {
      margin-block-end: 1.1rem;
      color: var(--muted);
      font-size: .9rem;
    }
    .contents {
      display: flex;
      flex-wrap: wrap;
      column-gap: clamp(.45rem, 2vw, 1.75rem);
      padding-block: .2rem;
      border-block: 1px solid var(--rule);
    }
    .contents a {
      display: inline-flex;
      min-inline-size: 44px;
      min-block-size: 44px;
      align-items: center;
      padding-inline: .4rem;
      font-size: .875rem;
      font-weight: 650;
      text-decoration: none;
    }
    .contents a:hover { text-decoration: underline; text-underline-offset: .24em; }
    main { padding-block-start: 1.55rem; }
    .directions { display: grid; gap: 1.6rem; }
    .short { --accent: var(--short); --wash: var(--short-wash); }
    .long { --accent: var(--long); --wash: var(--long-wash); }
    .section-title {
      font: 750 clamp(1.36rem, 3vw, 1.8rem)/1.3 var(--serif);
      letter-spacing: .035em;
    }
    .direction .section-title {
      padding-block: .65rem .7rem;
      border-block-start: 2px solid var(--accent);
      color: var(--accent);
    }
    .classes { display: grid; gap: .55rem; }
    .class-row {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: .3rem;
    }
    .class-row summary {
      display: grid;
      grid-template-columns: 1.1rem minmax(0, 1fr) max-content max-content;
      align-items: center;
      gap: clamp(.45rem, 1.4vw, 1.05rem);
      min-block-size: 64px;
      padding: .55rem clamp(.7rem, 2vw, 1rem);
      border-radius: .25rem;
      list-style: none;
      cursor: pointer;
    }
    .class-row summary::-webkit-details-marker { display: none; }
    .class-row[open] summary, .class-row summary:hover { background: var(--wash); }
    .class-row[open] summary { border-end-start-radius: 0; border-end-end-radius: 0; }
    .chevron {
      justify-self: center;
      inline-size: .55rem;
      block-size: .55rem;
      margin-inline-end: .23rem;
      border: solid var(--accent);
      border-width: 0 2px 2px 0;
      transform: rotate(-45deg);
    }
    [open] > summary .chevron {
      margin-inline-end: 0;
      margin-block-start: -.23rem;
      transform: rotate(45deg);
    }
    .class-name { font-size: clamp(1.08rem, 2.5vw, 1.28rem); font-weight: 720; }
    .stat {
      display: grid;
      min-inline-size: 2.55rem;
      gap: .1rem;
      justify-items: end;
      line-height: 1.15;
    }
    .stat-label { color: var(--muted); font-size: .75rem; }
    .stat .number { color: var(--accent); font-size: 1.22rem; font-weight: 650; }
    .ledger { padding: .25rem clamp(.75rem, 2.2vw, 1.15rem) .65rem; }
    .asset-group { padding-block-start: .55rem; }
    .asset-group + .asset-group { margin-block-start: .45rem; }
    .asset-group h3 {
      padding-block-end: .26rem;
      border-block-end: 1px solid var(--rule);
      color: var(--muted);
      font-size: .835rem;
      font-weight: 700;
    }
    .asset-list { margin: 0; padding: 0; list-style: none; }
    .asset {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      align-items: start;
      column-gap: .65rem;
      row-gap: .13rem;
      padding-block: .49rem;
    }
    .asset + .asset { border-block-start: 1px solid var(--soft-rule); }
    .asset-name {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: .04rem .6rem;
      min-inline-size: 0;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    .ticker { font-weight: 720; }
    .asset-status {
      margin-block-start: .05rem;
      padding: .12rem .4rem;
      border: 1px solid var(--soft-rule);
      border-radius: .2rem;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 650;
      text-align: center;
    }
    .asset-status.signal {
      background: var(--wash);
      border-color: transparent;
      color: var(--accent);
    }
    .asset-note, .empty-direct {
      color: var(--muted);
      font-size: .85rem;
    }
    .asset-note { grid-column: 1 / -1; }
    .empty-direct { padding-block: .5rem; }
    .record { margin-block-start: clamp(1.6rem, 4vw, 2.3rem); }
    .record .section-title {
      padding-block: .65rem;
      border-block-start: 2px solid var(--ink);
    }
    .reserved {
      min-block-size: 4.5rem;
      border-block: 1px solid var(--soft-rule);
      background: var(--paper);
    }
    .positions-note {
      margin-block: 0 .65rem;
      color: var(--muted);
      font-size: .86rem;
    }
    .positions { border-block: 1px solid var(--rule); background: var(--paper); }
    .position-head { display: none; }
    .position {
      display: grid;
      gap: .5rem;
      padding: .7rem .8rem;
    }
    .position + .position { border-block-start: 1px solid var(--rule); }
    .position h3 { font-size: .94rem; }
    .position h3 .ticker { margin-inline-end: .38em; }
    .position dl {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 6.75rem), 1fr));
      gap: .52rem .7rem;
    }
    .position dt { color: var(--muted); font-size: .785rem; }
    .position dd { font-size: .95rem; }
    .position .direction-label, .pnl { font-weight: 720; }
    .position .short-label, .pnl.loss { color: var(--short); }
    .position .long-label, .pnl.gain { color: var(--long); }
    .kelly-values {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      border-block: 1px solid var(--rule);
      background: var(--paper);
    }
    .kelly-values > div { padding: .65rem .85rem .85rem; }
    .kelly-values > div + div { border-inline-start: 1px solid var(--rule); }
    .kelly-values dt { font-weight: 650; font-size: .88rem; }
    .kelly-values dd { min-block-size: 1.7rem; }

    @media (min-width: 46rem) {
      .sheet { inline-size: min(calc(100% - 4rem), 70rem); }
      .directions { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .edition { flex-direction: row-reverse; }
    }
    @media (min-width: 52rem) {
      .positions {
        --position-columns: minmax(10rem, 1.55fr) repeat(2, minmax(3.4rem, .65fr))
                            repeat(2, minmax(4.6rem, .85fr)) minmax(6.7rem, 1fr);
        --position-gap: .85rem;
      }
      .position-head, .position {
        display: grid;
        grid-template-columns: var(--position-columns);
        align-items: baseline;
        gap: var(--position-gap);
        padding-inline: 1rem;
      }
      .position-head {
        padding-block: .55rem;
        border-block-end: 1px solid var(--rule);
        color: var(--muted);
        font-size: .8rem;
        font-weight: 650;
      }
      .position-head span:nth-child(n + 3), .position dl > div:nth-child(n + 2) {
        text-align: end;
      }
      .position dl {
        grid-column: 2 / -1;
        grid-template-columns: repeat(2, minmax(3.4rem, .65fr))
                               repeat(2, minmax(4.6rem, .85fr)) minmax(6.7rem, 1fr);
        gap: var(--position-gap);
      }
      .position dt {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    }
    /* asset-card-preview */
    li.asset.reader-card { display: block; padding: 15px 0 16px; min-width: 0; }
    li.asset.reader-card .reader-name { display: block; margin: 0; color: var(--ink); font-size: 19px; line-height: 1.45; font-weight: 650; overflow-wrap: anywhere; }
    li.asset.reader-card .reader-name > span { font-weight: 450; }
    li.asset.reader-card .reader-metrics { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin: 10px 0 0; }
    li.asset.reader-card .reader-metrics dt { margin: 0 0 1px; font-size: 13px; color: var(--muted); }
    li.asset.reader-card .reader-metrics dd { margin: 0; font-size: 19px; font-weight: 650; line-height: 1.45; overflow-wrap: anywhere; }
    li.asset.reader-card .reader-event { color: var(--accent); }
    li.asset.reader-card .reader-reason { margin: 11px 0 0; font-size: 16px; line-height: 1.55; color: var(--ink); overflow-wrap: anywhere; }
    li.asset.reader-card .reader-metric-note { margin: 3px 0 0; font-size: 13px; line-height: 1.45; color: var(--muted); overflow-wrap: anywhere; }
    /* /asset-card-preview */
  </style>
</head>
<body>
  <a class="skip-link" href="#report">跳到报告正文</a>
  <div class="sheet">
    <header class="masthead">
      <div class="edition">
        <span>趋势日报</span>
        <time datetime="${date}"><span class="number">${year}</span> 年 <span class="number">${month}</span> 月 <span class="number">${day}</span> 日</time>
      </div>
      <h1>趋势动物观察报告</h1>
      <p>${board_note}</p>
      <nav class="contents" aria-label="报告目录">
        <a href="#short">做空</a>
        <a href="#long">做多</a>
        <a href="#live">实盘</a>
        <a href="#simulation">模拟盘</a>
        <a href="#kelly">凯利胜率</a>
      </nav>
    </header>

    <main id="report" tabindex="-1">
      <div class="directions">
        <section id="short" class="direction short" aria-labelledby="short-title">
          <h2 id="short-title" class="section-title">可做空的大类</h2>
          <div class="classes">
${short_rows}
          </div>
        </section>

        <section id="long" class="direction long" aria-labelledby="long-title">
          <h2 id="long-title" class="section-title">可做多的大类</h2>
          <div class="classes">
${long_rows}
          </div>
        </section>
      </div>

      <section id="live" class="record" aria-labelledby="live-title">
        <h2 id="live-title" class="section-title">当前实盘持仓</h2>
        <div class="reserved"><p class="positions-note">未接入</p></div>
      </section>

      <section id="simulation" class="record" aria-labelledby="simulation-title">
        <h2 id="simulation-title" class="section-title">模拟盘持仓情况</h2>
        <p class="positions-note">未接入</p>
      </section>

      <section id="kelly" class="record" aria-labelledby="kelly-title">
        <h2 id="kelly-title" class="section-title">当前凯利胜率</h2>
        <dl class="kelly-values">
          <div><dt>实盘</dt><dd>未接入</dd></div>
          <div><dt>模拟盘</dt><dd>未接入</dd></div>
        </dl>
      </section>
    </main>
  </div>
  <template id="class_row">
            <details class="class-row"${open_attr}>
              <summary>
                <span class="chevron" aria-hidden="true"></span>
                <span class="class-name">${name}${ticker}</span>
                <span class="stat"><span class="stat-label">组内排名</span><span class="number">${seat}</span></span>
                <span class="stat"><span class="stat-label">强度</span><span class="number">${board_strength}</span></span>
              </summary>
              <div class="ledger">
                <div class="asset-group">
                  <h3>大类直属</h3>
${direct}
                </div>
                <div class="asset-group">
                  <h3>趋势动物里面能够查到</h3>
${searchable}
                </div>
                <div class="asset-group">
                  <h3>相关的标的</h3>
${related}
                </div>
${coverage_note}
              </div>
            </details>
  </template>
  <template id="ticker">
 <span class="ticker">${code}</span>
  </template>
  <template id="asset_list">
                  <ul class="asset-list" role="list">
${cards}
                  </ul>
  </template>
  <template id="asset_card">
                    <li class="asset reader-card">
                      <h4 class="reader-name">${code} <span>· ${name}</span></h4>
                      ${markers}
                      <dl class="reader-metrics">
                        <div><dt>当前趋势</dt><dd>${trend}</dd></div>
                        <div><dt>特殊信号</dt><dd class="reader-event">${signal}</dd></div>
                        <div><dt>全局强度</dt><dd>${strength}</dd>${strength_reason}</div>
                        <div><dt>同品种强度</dt><dd>${local_strength}</dd>${local_strength_reason}</div>
                      </dl>
                      <p class="reader-reason">${reason}</p>
                    </li>
  </template>
  <template id="empty_note">
<p class="empty-direct">${note}</p>
  </template>
</body>
</html>
