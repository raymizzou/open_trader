[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "open-trader"
version = "0.1.0"
description = "Monthly portfolio aggregation and trading analysis tools"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "backtrader>=1.9.78",
    "futu-api",
    "openai>=2.0.0",
    "ortools==9.15.6755",
    "polymarket-client==0.2.0",
    "predict-sdk==0.0.22",
    "pdfplumber>=0.11.9",
    "tigeropen",
]

[project.optional-dependencies]
dev = [
    "playwright>=1.52",
    "pytest>=8.0",
]

[project.scripts]
open-trader = "open_trader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_trader = [
    "dashboard_static/*.html",
    "dashboard_static/*.css",
    "dashboard_static/*.js",
    "schemas/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
